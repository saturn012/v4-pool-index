[package]
name = "v4-pool-index-consumer"
version = "0.1.0"
edition = "2021"
description = "Composed consumer for the published v4-pool-index Substreams package"
repository = "https://github.com/saturn012/v4-pool-index"
license = "MIT"

[lib]
name = "consumer"
crate-type = ["cdylib"]

[dependencies]
prost = "0.13"
substreams = "0.7.6"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
