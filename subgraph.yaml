specVersion: 1.3.0
description: Raw Uniswap v4 pool identity index for Robinhood Chain
repository: https://github.com/saturn012/v4-pool-index
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PoolManager
    network: robinhood
    source:
      address: "0x8366a39cc670b4001a1121b8f6a443a643e40951"
      abi: PoolManager
      startBlock: 9070
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
      abis:
        - name: PoolManager
          file: ./abis/PoolManager.json
      eventHandlers:
        - event: Initialize(indexed bytes32,indexed address,indexed address,uint24,int24,address,uint160,int24)
          handler: handleInitialize
      file: ./src/pool-manager.ts
